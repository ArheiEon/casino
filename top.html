<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Топ игроков</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--felt:#0f4d3a;--deep:#0a3328;--brass:#d9a441;--cream:#f3ead3;--ruby:#b3262e;--ink:#14110d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--cream);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0,#17604a,var(--deep) 70%) fixed;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
header{display:flex;justify-content:flex-end}
.bank{display:flex;align-items:center;gap:8px;background:var(--ink);border-radius:999px;padding:4px 16px 4px 4px;box-shadow:0 0 0 2px var(--brass)}
.chip{width:34px;height:34px;border-radius:50%;background:var(--ruby);border:3px dashed var(--cream);box-shadow:inset 0 0 0 3px var(--ruby)}
#bal{font-size:22px;font-weight:800;color:var(--brass)}
.table{background:radial-gradient(ellipse at 50% 30%,#1a6b52,var(--felt) 75%);border-radius:22px;padding:18px 14px;margin:14px 4px 0;box-shadow:0 0 0 3px var(--brass),0 0 0 7px var(--ink),inset 0 0 40px rgba(0,0,0,.4);text-align:center}
h2{margin:0 0 6px}p{margin:6px 0}
.topnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.topnav a{background:rgba(15,77,58,.9);border-radius:12px;padding:9px 2px;text-align:center;font-weight:700;font-size:14px;text-decoration:none;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(243,234,211,.15)}
.topnav a[aria-current=page]{background:linear-gradient(var(--brass),#b8862a);color:var(--ink)}
ol{list-style:none;margin:12px 0 0;padding:0;text-align:left}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(10,51,40,.6);margin-bottom:6px}
li.me{background:var(--cream);color:var(--ink)}
li span:first-child{width:30px;text-align:center;font-size:20px;font-weight:800}
li b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li span:last-child{font-weight:800;color:var(--brass);font-variant-numeric:tabular-nums}li.me span:last-child{color:var(--ink)}
small{opacity:.7}
</style>
</head>
<body>
<div class="topnav"><a href="./">🎰 Игры</a><a href="duel.html">⚔️ Дуэль</a><a href="top.html" aria-current="page">🏆 Топ</a></div>
<header><div class="bank"><div class="chip"></div><span id="bal">…</span></div></header>
<main class="table"><h2>🏆 Топ игроков</h2><small>Онлайн-фишки из дуэлей</small><ol id="list"></ol><p id="mine"></p></main>
<script>
const API = 'https://casino-online.arheieoncasino.workers.dev';
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = p => fetch(API + p, { headers: { Authorization: 'tma ' + tg.initData } }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
(async () => {
  if (!tg || !tg.initData) { $('#list').innerHTML = '<p>Открой эту страницу через Telegram, по кнопке бота.</p>'; return; }
  try {
    const me = await api('/api/me'); $('#bal').textContent = me.balance.toLocaleString('ru-RU');
    const r = await api('/api/top'), medal = ['🥇', '🥈', '🥉'];
    $('#list').innerHTML = r.top.map((p, i) => `<li class="${p.you ? 'me' : ''}"><span>${medal[i] || i + 1}</span><b>${esc(p.name)}</b><span>${p.bal.toLocaleString('ru-RU')}</span></li>`).join('');
    $('#mine').textContent = r.rank > 10 ? 'Твоё место: ' + r.rank : '';
  } catch (e) { $('#list').innerHTML = '<p>Сервер недоступен.</p>'; }
})();
</script>
</body>
</html>
